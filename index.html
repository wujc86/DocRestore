<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>引書體例及還原查詢系統</title>
    <link rel="icon" href="static/pic/DocRestore.ico" type="image/x-icon" />
    <link rel="stylesheet" href="static/css/DocRestore.css" type="text/css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/DocRestore.js"></script>

    <script type="text/javascript">
        $(document).ready(function(){
            console.log("系統初始化成功，資料路徑設定為 ./data/");
            $("#QueryWord").focus(); 
        });
    </script>
</head>
<body>
    <div id="container">	
        <div id="leftCol">
            <div style="text-align: center; margin-bottom: 15px;">
                <img id="mylogo" src="static/pic/DocRestoreLogo.png" style="width: 100%; height: auto; max-width: 240px;">
            </div>

            <form id="QueryForm" onsubmit="getQueryResult(); return false;">
                <input type="text" name="QueryWord" id="QueryWord" placeholder="輸入查詢字串"/>
                <button type="button" id="QueryButton" onclick="getQueryResult()">查詢</button>
            </form>

            <div id="resultArea">
                <div class="info_block_s" id="AuthorDynastyInfo">
                    <div class="info_title_s" onclick="ToggleInfo('AuthorDynastyInfoContent')">[作者朝代]</div>
                    <div class="info_content_s" id="AuthorDynastyInfoContent"></div>
                </div>
                <div class="info_block_s" id="TSLegendsInfo">
                    <div class="info_title_s" onclick="ToggleInfo('TSLegendsInfoContent')">[唐宋傳奇]</div>
                    <div class="info_content_s" id="TSLegendsInfoContent"></div>
                </div>
            </div>
        </div> 

        <div id="rightCol">	
            <div class="info_block" id="CiteFormInfo">
                <div class="info_title" onclick="ToggleInfo('CiteFormInfoContent')">[引書體例]</div>
                <div class="info_content" id="CiteFormInfoContent"></div>
            </div>
            <div class="info_block" id="SYAuthorInfo">
                <div class="info_title" onclick="ToggleInfo('SYAuthorInfoContent')">[宋元之後]</div>
                <div class="info_content" id="SYAuthorInfoContent"></div>
            </div>
            <div class="info_block" id="BookstoreInfo">
                <div class="info_title" onclick="ToggleInfo('BookstoreInfoContent')">[藏書地點]</div>
                <div class="info_content" id="BookstoreInfoContent"></div>
            </div>
            <div class="info_block" id="RestorationInfo">
                <div class="info_title" onclick="ToggleInfo('RestorationInfoContent')">[已經還原]</div>
                <div class="info_content" id="RestorationInfoContent"></div>
            </div>
        </div>
    </div>
</body>
</html>
