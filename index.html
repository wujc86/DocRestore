<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>引書體例及還原查詢系統</title>
<link rel="icon" href="static/pic/DocRestore.ico" type="image/x-icon" />
<link rel="stylesheet" href="static/css/DocRestore.css" type="text/css" />

<script language="JavaScript" type="text/javascript" src="static/js/jquery-3.3.1.min.js"></script>
<script language="JavaScript" type="text/javascript" src="static/js/DocRestore.js"></script>

<script language="JavaScript" type="text/javascript">
$(document).ready(function(){
	$("#QueryWord").focus(); //直接跳到輸入框

    $("#QueryWord").keypress(function(event){       
        if (event.keyCode == 13) {        	
        	getQueryResult();//取得對應的查詢結果
        	return false;
        }
    });		

	$("#QueryButton").click(function(){
		getQueryResult(); //取得對應的查詢結果
		return false;
	});	
})
</script>
</head>
<body>
	<div id="container">	
		<div id="leftCol">
			<img id="mylogo" src="static/pic/DocRestoreLogo.png" height="90px">
			<form id="QueryForm" name="QueryForm">
				<input type="text" name="QueryWord" id="QueryWord" placeholder="輸入查詢字串"/>	
			</form>
			<button id="QueryButton">查詢</button>
			<div id="resultArea">
				<div class="info_block_s" id="AuthorDynastyInfo">
					<div class="info_title_s">[作者朝代]<span id="AuthorDynastyInfoTitle"></span></div>
					<div class="info_content_s" id="AuthorDynastyInfoContent"></div>
				</div>

				<div class="info_block_s" id="TSLegendsInfo">
					<div class="info_title_s">[唐宋傳奇]<span id="TSLegendsInfoTitle"></span></div>
					<div class="info_content_s" id="TSLegendsInfoContent"></div>
				</div>
			</div>
		</div> <!--leftColumn-->
		<div id="rightCol">	
			<div class="info_block" id="CiteFormInfo">
				<div class="info_title">[引書體例]<span id="CiteFormInfoTitle"></span></div>
				<div class="info_content" id="CiteFormInfoContent"></div>
			</div>
			<div class="info_block" id="SYAuthorInfo">
				<div class="info_title">[宋元之後]<span id="SYAuthorInfoTitle"></span></div>
				<div class="info_content" id="SYAuthorInfoContent"></div>
			</div>
			<div class="info_block" id="BookstoreInfo">
				<div class="info_title">[藏書地點]<span id="BookstoreInfoTitle"></span></div>
				<div class="info_content" id="BookstoreInfoContent"></div>
			</div>
			<div class="info_block" id="RestorationInfo">
				<div class="info_title">[已經還原]<span id="RestorationInfoTitle"></span></div>
				<div class="info_content" id="RestorationInfoContent"></div>
			</div>

		</div><!--rightColumn-->
	</div> <!--Container-->
	<!-- <div id="footer">本系統最佳解析度 1280 X 800，請用Chrome瀏覽器</div>
</body>
</html>
